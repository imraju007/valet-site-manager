  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)" filter="url(#glow)"/>
  <text
    x="16" y="23"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="19"
    font-weight="800"
    text-anchor="middle"
    fill="#000">S</text>
